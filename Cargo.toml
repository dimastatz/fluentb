[package]
name = "fluentb"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Dictate and rewrite text in any app, with local Whisper transcription."
license = "MIT"

[dependencies]
global-hotkey = "0.9"
fs4 = "1.1"
sha2 = "0.11"
# Model downloads only. Native TLS uses the OS certificate store.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[lints.rust]
# Deny, not forbid, so platform modules can opt in with `#![allow(unsafe_code)]`.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# CLAUDE.md: no unwrap/expect/panic outside tests (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# CLAUDE.md prefers iterator chains, including `for_each`, over `for` loops.
needless_for_each = "allow"
# Every fallible API returns `FacadeError`, which already names the failing subsystem.
missing_errors_doc = "allow"
# The suggested `assert_eq!(v, [] as [T; 0])` reads worse than `assert!(v.is_empty())`.
assert_is_empty = "allow"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.7", default-features = false }
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
cpal = "0.18"
# Dynamically linked: whisper-rs links its own ggml statically, and two static copies
# would clash. See build.rs for the rpath.
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal", "dynamic-link"] }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
tao = "0.37"
tray-icon = "0.26"
whisper-rs = { version = "0.16", features = ["metal"] }
